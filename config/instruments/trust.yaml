source: "Jian, J.-Y., Bisantz, A. M., & Drury, C. G. (2000). Foundations for an empirically determined scale of trust in automated systems. International Journal of Cognitive Ergonomics, 4(1), 53–71. https://doi.org/10.1207/S15327566IJCE0401_04"
trigger: post_task
scale:
  min: 1
  max: 7
  anchors: ["not at all", "extremely"]
items:
  - id: dependable
    wording: "The system is dependable."
  - id: trust
    wording: "I can trust the system."
  - id: deceptive
    wording: "The system is deceptive."
    reverse_scored: true
  - id: confident
    wording: "I am confident in the system."
